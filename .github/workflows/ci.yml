name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test-build:
    name: Backend lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      CORS_ORIGINS: http://localhost:5173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend lint
        working-directory: backend
        run: |
          python -m compileall app main.py

      - name: Run database migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: |
          pytest

      - name: Build backend import check
        working-directory: backend
        run: |
          python -c "import main"

  frontend-lint-test-build:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --runInBand

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify frontend-backend env wiring
        run: |
          test -n "$VITE_API_BASE_URL"
          echo "Frontend API base URL: $VITE_API_BASE_URL"

  e2e-smoke:
    name: End-to-end smoke validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend-lint-test-build
      - frontend-lint-test-build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      CORS_ORIGINS: http://localhost:5173
      VITE_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Smoke-check backend API contract
        working-directory: backend
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          backend_pid=$!
          trap 'kill $backend_pid' EXIT
          sleep 8
          python - <<'PY'
import json
import urllib.request
payload = json.dumps({"title":"CI smoke todo","description":None,"due_date":None,"priority":"medium","tags":["ci"],"completed":False,"position":None}).encode()
req = urllib.request.Request("http://127.0.0.1:8000/api/todos", data=payload, headers={"Content-Type":"application/json"}, method="POST")
with urllib.request.urlopen(req) as resp:
    assert resp.status in (200, 201)
    body = json.loads(resp.read().decode())
    assert body["title"] == "CI smoke todo"
PY

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend-lint-test-build
      - frontend-lint-test-build
      - e2e-smoke
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.DEPLOYMENT_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm deploy target is configured
        env:
          DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL }}
          DEPLOY_PROVIDER: ${{ vars.DEPLOY_PROVIDER }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "DEPLOYMENT_URL is not configured; skipping deploy stub."
            exit 0
          fi
          echo "Deploy target: ${DEPLOY_PROVIDER:-platform-default}"
          echo "Deployment URL: $DEPLOYMENT_URL"
          echo "No auth-related deploy steps are defined in this workflow."

      - name: Deploy stub
        if: ${{ vars.DEPLOYMENT_URL != '' }}
        run: |
          echo "Insert platform-specific deploy command here once the target is configured."
          echo "This job is gated by repository/environment variables and is ready for deployment wiring."

      - name: Health check placeholder
        if: ${{ vars.DEPLOYMENT_URL != '' }}
        run: |
          echo "Health check should poll GET /health or /healthz for 200 within 60 seconds after deploy."
